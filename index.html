<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appart CRM</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background: #0f172a; color: #f1f5f9; }
    .header { background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid #1e293b; padding: 16px; position: sticky; top: 0; z-index: 50; }
    .header-content { max-width: 1200px; margin: 0 auto; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header-top h1 { font-size: 24px; font-weight: bold; }
    .btn-filter { padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-filter.active { background: #b45309; color: white; }
    .btn-filter.inactive { background: #1e293b; color: #cbd5e1; }
    .calendar-container { background: #1e293b; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 600; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .calendar-day-label { text-align: center; font-size: 11px; color: #64748b; padding: 4px; font-weight: 600; }
    .calendar-day { text-align: center; padding: 8px 4px; font-size: 12px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
    .calendar-day.empty { background: transparent; }
    .calendar-day.has-event { background: #d97706; color: white; font-weight: bold; }
    .calendar-day.today { background: #334155; border: 1px solid #d97706; }
    .calendar-day.clickable:hover { background: #334155; }
    .daily-visits { background: #1e293b; border-radius: 6px; padding: 12px; margin-bottom: 16px; }
    .daily-visits h4 { font-weight: 600; margin-bottom: 8px; color: #fbbf24; }
    .visit-item { background: #0f172a; padding: 10px; border-radius: 4px; margin-bottom: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .visit-item:hover { background: #1e293b; }
    .visit-time { color: #fbbf24; font-weight: 600; }
    .main-content { max-width: 1200px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
    @media (max-width: 1024px) { .main-content { grid-template-columns: 1fr; } }
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .btn-add { background: #d97706; color: white; border: none; border-radius: 6px; padding: 8px 12px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-add:hover { background: #b45309; }
    .list-apparts { display: flex; flex-direction: column; gap: 8px; }
    .appart-btn { text-align: left; padding: 12px; border-radius: 6px; border: 1px solid #1e293b; background: #1e293b; color: #f1f5f9; cursor: pointer; transition: all 0.2s; }
    .appart-btn.selected { border-color: #d97706; }
    .appart-btn-title { font-weight: 600; font-size: 14px; }
    .appart-btn-info { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .appart-btn-score { font-size: 14px; font-weight: bold; color: #fbbf24; }
    .detail-card { background: #1e293b; border: 1px solid #1e293b; border-radius: 6px; padding: 24px; overflow-y: auto; max-height: 85vh; }
    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .detail-title h2 { font-size: 24px; font-weight: bold; margin-bottom: 4px; }
    .detail-title p { font-size: 14px; color: #94a3b8; }
    .score-big { font-size: 32px; font-weight: bold; color: #fbbf24; }
    .btn-delete-appart { background: #dc2626; color: white; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .btn-delete-appart:hover { background: #991b1b; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; background: #0f172a; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    .stat-item { text-align: center; }
    .stat-label { font-size: 12px; color: #64748b; }
    .stat-value { font-weight: bold; margin-top: 4px; }
    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; margin-top: 16px; }
    .section-title:first-of-type { margin-top: 0; }
    .visits-list { max-height: 150px; overflow-y: auto; margin-bottom: 12px; }
    .visit-card { background: #0f172a; padding: 10px; border-radius: 4px; margin-bottom: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s; }
    .visit-card:hover { background: #1e293b; }
    .visit-info { flex: 1; }
    .visit-card-time { color: #fbbf24; font-weight: 600; }
    .add-section { background: #0f172a; border-radius: 6px; padding: 12px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
    .add-section h4 { font-weight: 600; font-size: 13px; }
    .calls-list { max-height: 192px; overflow-y: auto; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
    .call-item { background: #0f172a; border-radius: 6px; padding: 12px; font-size: 14px; }
    .call-date { font-family: monospace; font-size: 12px; color: #64748b; display: flex; align-items: center; gap: 8px; }
    .call-note { color: #e2e8f0; margin-top: 8px; }
    input[type="date"], input[type="time"], input[type="text"], input[type="number"], textarea { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; font-size: 14px; color: #f1f5f9; font-family: inherit; }
    input[type="date"]:focus, input[type="time"]:focus, input[type="text"]:focus, input[type="number"]:focus, textarea:focus { outline: none; border-color: #d97706; }
    textarea { resize: vertical; min-height: 60px; }
    .btn-save { width: 100%; background: #d97706; color: white; border: none; border-radius: 6px; padding: 8px 16px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .btn-save:hover:not(:disabled) { background: #b45309; }
    .btn-save:disabled { background: #1e293b; cursor: not-allowed; opacity: 0.5; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #1e293b; border-radius: 8px; padding: 24px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 20px; font-weight: bold; margin-bottom: 16px; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
    .btn-cancel { background: #334155; color: white; border: none; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; flex: 1; }
    .btn-cancel:hover { background: #475569; }
    .btn-back { background: none; border: none; color: #fbbf24; cursor: pointer; font-size: 14px; margin-bottom: 12px; }
    .question-card { background: #0f172a; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .question-text { font-weight: 600; margin-bottom: 8px; }
    .answer-text { color: #cbd5e1; font-size: 13px; font-style: italic; }
    .empty-state { background: #1e293b; border: 1px solid #1e293b; border-radius: 6px; padding: 24px; text-align: center; color: #64748b; }
    .btn-delete { background: none; border: none; color: #64748b; cursor: pointer; padding: 4px; font-size: 14px; }
    .btn-delete:hover { background: #0f172a; border-radius: 4px; }
    .divider { border-top: 1px solid #1e293b; margin: 16px 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function Calendar({ events, onDateClick }) {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const eventDates = events.map(d => new Date(d).getDate());
      const days = [];
      
      for (let i = 0; i < firstDay; i++) days.push(null);
      for (let i = 1; i <= daysInMonth; i++) days.push(i);
      
      const dayLabels = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
      
      return (
        <div className="calendar-container">
          <div className="calendar-header">
            <span>{new Date(year, month).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</span>
          </div>
          <div className="calendar-grid">
            {dayLabels.map(label => <div key={label} className="calendar-day-label">{label}</div>)}
            {days.map((day, idx) => (
              <div 
                key={idx} 
                className={`calendar-day ${day === null ? 'empty' : eventDates.includes(day) ? 'has-event clickable' : day === today.getDate() ? 'today clickable' : 'clickable'}`}
                onClick={() => day !== null && onDateClick(new Date(year, month, day).toISOString().split('T')[0])}
              >
                {day}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AppartCRM() {
      const [apparts, setApparts] = useState([]);
      const [selectedAppart, setSelectedAppart] = useState(null);
      const [selectedVisit, setSelectedVisit] = useState(null);
      const [newCall, setNewCall] = useState({ date: '', note: '', relanceDate: '' });
      const [newVisit, setNewVisit] = useState({ date: '', time: '' });
      const [newQuestion, setNewQuestion] = useState('');
      const [filterRelance, setFilterRelance] = useState(false);
      const [selectedDateForVisits, setSelectedDateForVisits] = useState(null);
      const [showAddAppart, setShowAddAppart] = useState(false);
      const [newAppart, setNewAppart] = useState({ name: '', price: '', surface: '', location: '', score: '' });

      const initData = [
        { id: 1, name: 'Esplanade F3 balcon', price: 162750, surface: 61, location: 'Esplanade', score: 9, notes: 'Meilleur combo emplacement/prix/Airbnb/potentiel', calls: [], visits: [] },
        { id: 2, name: 'Neudorf 3P 62m²', price: 153000, surface: 62, location: 'Neudorf', score: 8.5, notes: 'Prix/m² imbattable, garage, cave, à rénover', calls: [], visits: [] },
        { id: 3, name: 'Kléber-Gare 2P 59m²', price: 210000, surface: 59, location: 'Kléber-Gare', score: 7, notes: 'Particulier, emplacement top Airbnb, négo 185-190k', calls: [], visits: [] },
        { id: 4, name: 'Neudorf F4 Place du Marché', price: 219000, surface: 82, location: 'Neudorf', score: 7, notes: 'Surface imbattable, petit levier travaux', calls: [], visits: [] },
        { id: 5, name: 'Petite France F2', price: 199990, surface: 39.7, location: 'Petite France', score: 6.5, notes: 'Meilleur Airbnb mais petit, prix/m² élevé', calls: [], visits: [] },
        { id: 6, name: 'La Meinau 3P 85m²', price: 199000, surface: 85, location: 'La Meinau', score: 6.5, notes: 'Surface exceptionnelle, DPE C, travaux possibles', calls: [], visits: [] },
        { id: 7, name: 'Neudorf T2 42m²', price: 136500, surface: 42, location: 'Neudorf', score: 6, notes: 'DPE C/GES A, parking, terrasse', calls: [], visits: [] },
        { id: 8, name: 'Neudorf T2 rénové', price: 159950, surface: 41, location: 'Neudorf', score: 5.5, notes: 'Entièrement rénové = zéro levier travaux', calls: [], visits: [] },
        { id: 9, name: 'Neudorf F3 62m²', price: 199400, surface: 62, location: 'Neudorf', score: 5.5, notes: 'Partiellement rénové, DPE D/GES B, garage', calls: [], visits: [] },
        { id: 10, name: 'Vauban Est 3P', price: 215000, surface: 57, location: 'Vauban Est', score: 5, notes: 'Copro en cours = risque juridique réel', calls: [], visits: [] },
        { id: 11, name: 'Esplanade T2', price: 155875, surface: 41, location: 'Esplanade', score: 5, notes: 'DPE E = risque réglementaire inlouable 2034', calls: [], visits: [] },
        { id: 12, name: 'Esplanade Krutenau', price: 193158, surface: 51, location: 'Esplanade', score: 4.5, notes: '4e sans ascenseur = éliminatoire pour revente', calls: [], visits: [] },
        { id: 13, name: 'Robertsau T2', price: 173000, surface: 45.8, location: 'Robertsau', score: 4.5, notes: 'DPE C/B excellent mais quartier trop excentré', calls: [], visits: [] },
        { id: 14, name: 'Studio Krutenau', price: 140000, surface: 28, location: 'Krutenau', score: 3, notes: 'Trop petit, zéro potentiel', calls: [], visits: [] },
        { id: 15, name: 'Neudorf F3 Orpi', price: 235000, surface: 74, location: 'Neudorf', score: 3, notes: 'Trop cher, DPE E', calls: [], visits: [] },
        { id: 16, name: 'Vauban Est Foncia 2P', price: 205000, surface: 50, location: 'Vauban Est', score: 3, notes: 'Trop cher pour la surface', calls: [], visits: [] },
        { id: 17, name: 'Neudorf F3 terrasse', price: 240000, surface: 60, location: 'Neudorf', score: 2, notes: 'Hors budget total', calls: [], visits: [] },
        { id: 18, name: 'Quartier Marne Orangerie', price: 218000, surface: 53, location: 'Quartier Marne', score: 2, notes: 'Hors budget, peu de levier', calls: [], visits: [] },
      ];

      const getRank = (index) => {
        const ranks = ['🥇', '🥈', '🥉'];
        return ranks[index] || (index + 1).toString();
      };

      const sortAndRankApparts = (list) => {
        const sorted = [...list].sort((a, b) => b.score - a.score);
        return sorted.map((a, idx) => ({ ...a, rank: getRank(idx) }));
      };

      useEffect(() => {
        const saved = localStorage.getItem('apparts');
        if (saved) {
          const data = JSON.parse(saved);
          const fixed = data.map(a => ({ ...a, visits: (a.visits || []).map(v => ({ ...v, questions: v.questions || [] })), calls: a.calls || [] }));
          const sorted = sortAndRankApparts(fixed);
          setApparts(sorted);
        } else {
          const sorted = sortAndRankApparts(initData);
          setApparts(sorted);
        }
      }, []);

      useEffect(() => {
        if (apparts.length > 0) localStorage.setItem('apparts', JSON.stringify(apparts));
      }, [apparts]);

      const handleAddAppartSubmit = () => {
        if (!newAppart.name || !newAppart.price || !newAppart.surface || !newAppart.location || !newAppart.score) {
          alert('Remplis tous les champs');
          return;
        }
        const newId = Math.max(...apparts.map(a => a.id), 0) + 1;
        const added = {
          id: newId,
          name: newAppart.name,
          price: parseInt(newAppart.price),
          surface: parseFloat(newAppart.surface),
          location: newAppart.location,
          score: parseFloat(newAppart.score),
          notes: '',
          calls: [],
          visits: []
        };
        const sorted = sortAndRankApparts([...apparts, added]);
        setApparts(sorted);
        setSelectedAppart(sorted.find(a => a.id === newId));
        setShowAddAppart(false);
        setNewAppart({ name: '', price: '', surface: '', location: '', score: '' });
      };

      const handleDeleteAppart = () => {
        if (!selectedAppart) return;
        if (confirm('Supprimer cet appart ?')) {
          const filtered = apparts.filter(a => a.id !== selectedAppart.id);
          const sorted = sortAndRankApparts(filtered);
          setApparts(sorted);
          setSelectedAppart(null);
        }
      };

      const handleAddVisit = () => {
        if (!selectedAppart || !newVisit.date || !newVisit.time) return;
        const visit = { date: newVisit.date, time: newVisit.time, questions: [] };
        const updated = apparts.map(a => 
          a.id === selectedAppart.id ? { ...a, visits: [...(a.visits || []), visit] } : a
        );
        setApparts(updated);
        setSelectedAppart(updated.find(a => a.id === selectedAppart.id));
        setNewVisit({ date: '', time: '' });
      };

      const handleDeleteVisit = (idx) => {
        const updated = apparts.map(a => 
          a.id === selectedAppart.id ? { ...a, visits: (a.visits || []).filter((_, i) => i !== idx) } : a
        );
        setApparts(updated);
        setSelectedAppart(updated.find(a => a.id === selectedAppart.id));
      };

      const handleAddQuestion = () => {
        if (!selectedVisit || !newQuestion.trim()) return;
        const visitIdx = selectedAppart.visits.findIndex(v => v.date === selectedVisit.date && v.time === selectedVisit.time);
        if (visitIdx === -1) return;
        
        const question = { id: Date.now(), text: newQuestion, answer: '' };
        const updated = apparts.map(a => {
          if (a.id === selectedAppart.id) {
            const newVisits = [...a.visits];
            newVisits[visitIdx].questions.push(question);
            return { ...a, visits: newVisits };
          }
          return a;
        });
        setApparts(updated);
        setSelectedAppart(updated.find(a => a.id === selectedAppart.id));
        const visit = updated.find(a => a.id === selectedAppart.id).visits[visitIdx];
        setSelectedVisit({ ...visit });
        setNewQuestion('');
      };

      const handleUpdateAnswer = (questionId, answer) => {
        const visitIdx = selectedAppart.visits.findIndex(v => v.date === selectedVisit.date && v.time === selectedVisit.time);
        const questionIdx = selectedAppart.visits[visitIdx].questions.findIndex(q => q.id === questionId);
        
        const updated = apparts.map(a => {
          if (a.id === selectedAppart.id) {
            const newVisits = [...a.visits];
            newVisits[visitIdx].questions[questionIdx].answer = answer;
            return { ...a, visits: newVisits };
          }
          return a;
        });
        setApparts(updated);
        setSelectedAppart(updated.find(a => a.id === selectedAppart.id));
        const visit = updated.find(a => a.id === selectedAppart.id).visits[visitIdx];
        setSelectedVisit({ ...visit });
      };

      const handleDeleteQuestion = (questionId) => {
        const visitIdx = selectedAppart.visits.findIndex(v => v.date === selectedVisit.date && v.time === selectedVisit.time);
        const updated = apparts.map(a => {
          if (a.id === selectedAppart.id) {
            const newVisits = [...a.visits];
            newVisits[visitIdx].questions = newVisits[visitIdx].questions.filter(q => q.id !== questionId);
            return { ...a, visits: newVisits };
          }
          return a;
        });
        setApparts(updated);
        setSelectedAppart(updated.find(a => a.id === selectedAppart.id));
        const visit = updated.find(a => a.id === selectedAppart.id).visits[visitIdx];
        setSelectedVisit({ ...visit });
      };

      const handleAddCall = () => {
        if (!selectedAppart || !newCall.note || !newCall.date) return;
        const updated = apparts.map(a => 
          a.id === selectedAppart.id ? { ...a, calls: [...(a.calls || []), newCall] } : a
        );
        setApparts(updated);
        setSelectedAppart(updated.find(a => a.id === selectedAppart.id));
        setNewCall({ date: '', note: '', relanceDate: '' });
      };

      const handleDeleteCall = (idx) => {
        const updated = apparts.map(a => 
          a.id === selectedAppart.id ? { ...a, calls: (a.calls || []).filter((_, i) => i !== idx) } : a
        );
        setApparts(updated);
        setSelectedAppart(updated.find(a => a.id === selectedAppart.id));
      };

      const getAllEventDates = () => {
        const dates = [];
        apparts.forEach(a => {
          (a.visits || []).forEach(v => dates.push(v.date));
          (a.calls || []).forEach(c => {
            if (c.relanceDate) dates.push(c.relanceDate);
          });
        });
        return dates;
      };

      const getVisitsForDate = (date) => {
        const visits = [];
        apparts.forEach(a => {
          (a.visits || []).forEach(v => {
            if (v.date === date) visits.push({ ...v, apartName: a.name, apartRank: a.rank, apartId: a.id });
          });
        });
        return visits.sort((a, b) => a.time.localeCompare(b.time));
      };

      const visitsToday = selectedDateForVisits ? getVisitsForDate(selectedDateForVisits) : [];
      const displayApparts = filterRelance ? apparts.filter(a => 
        (a.calls || []).some(call => {
          const d = new Date(call.relanceDate);
          const today = new Date();
          const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
          return d >= today && d <= nextWeek;
        })
      ) : apparts;

      if (selectedVisit && selectedAppart) {
        return (
          <div style={{ minHeight: '100vh', background: '#0f172a' }}>
            <div className="header">
              <div className="header-content">
                <button className="btn-back" onClick={() => setSelectedVisit(null)}>← Retour</button>
                <h1>{selectedAppart.rank} {selectedAppart.name}</h1>
              </div>
            </div>
            <div className="main-content">
              <div style={{ gridColumn: '1 / -1' }}>
                <div className="detail-card">
                  <h2 style={{ marginBottom: '16px' }}>📍 Visite du {new Date(selectedVisit.date).toLocaleDateString('fr-FR')} à {selectedVisit.time}</h2>
                  
                  <div className="section-title">Questions à préparer</div>
                  {(selectedVisit.questions || []).length === 0 ? (
                    <p style={{ fontSize: '12px', color: '#64748b', marginBottom: '12px' }}>Aucune question</p>
                  ) : (
                    <div style={{ marginBottom: '12px' }}>
                      {(selectedVisit.questions || []).map(q => (
                        <div key={q.id} className="question-card">
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px' }}>
                            <div className="question-text">Q: {q.text}</div>
                            <button className="btn-delete" onClick={() => handleDeleteQuestion(q.id)}>✕</button>
                          </div>
                          {q.answer ? (
                            <div>
                              <textarea 
                                value={q.answer}
                                onChange={(e) => handleUpdateAnswer(q.id, e.target.value)}
                                placeholder="Réponse..."
                                style={{ marginTop: '8px' }}
                              />
                            </div>
                          ) : (
                            <textarea 
                              onChange={(e) => handleUpdateAnswer(q.id, e.target.value)}
                              placeholder="Réponse (après la visite)..."
                              style={{ marginTop: '8px' }}
                            />
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                  
                  <div className="add-section">
                    <h4>Ajouter une question</h4>
                    <textarea 
                      value={newQuestion}
                      onChange={(e) => setNewQuestion(e.target.value)}
                      placeholder="Ex: État du chauffage? Nuisances sonores?..."
                      rows="2"
                    />
                    <button className="btn-save" disabled={!newQuestion.trim()} onClick={handleAddQuestion}>+ Ajouter question</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div style={{ minHeight: '100vh', background: '#0f172a' }}>
          <div className="header">
            <div className="header-content">
              <div className="header-top">
                <h1>Appart CRM</h1>
                <button className={`btn-filter ${filterRelance ? 'active' : 'inactive'}`} onClick={() => setFilterRelance(!filterRelance)}>
                  {filterRelance ? '📅 À relancer cette semaine' : 'Tous les apparts'}
                </button>
              </div>
            </div>
          </div>
          <div className="main-content">
            <div>
              <Calendar events={getAllEventDates()} onDateClick={setSelectedDateForVisits} />
              {selectedDateForVisits && visitsToday.length > 0 && (
                <div className="daily-visits">
                  <h4>📅 Visites du {new Date(selectedDateForVisits).toLocaleDateString('fr-FR')}</h4>
                  {visitsToday.map((v, idx) => (
                    <div key={idx} className="visit-item" onClick={() => {
                      setSelectedAppart(apparts.find(a => a.id === v.apartId));
                      setSelectedVisit(v);
                    }}>
                      <span className="visit-time">{v.time}</span> - {v.apartRank} {v.apartName}
                      {(v.questions || []).length > 0 && <span style={{ marginLeft: '8px', color: '#cbd5e1', fontSize: '12px' }}>({(v.questions || []).length} Q)</span>}
                    </div>
                  ))}
                </div>
              )}
              <div className="list-header">
                <span style={{ fontWeight: 600 }}>Apparts ({displayApparts.length})</span>
                <button className="btn-add" onClick={() => setShowAddAppart(true)}>+ Ajouter</button>
              </div>
              <div className="list-apparts">
                {displayApparts.map(appart => (
                  <button key={appart.id} className={`appart-btn ${selectedAppart?.id === appart.id ? 'selected' : ''}`} onClick={() => setSelectedAppart(appart)}>
                    <div className="appart-btn-title">{appart.rank} {appart.name}</div>
                    <div className="appart-btn-info">{appart.price.toLocaleString()}€ • {appart.surface}m²</div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '8px' }}>
                      <span style={{ fontSize: '12px', color: '#64748b' }}>
                        {(appart.visits || []).length > 0 && `📍 ${(appart.visits || []).length}`}
                        {(appart.visits || []).length > 0 && (appart.calls || []).length > 0 && ' | '}
                        {(appart.calls || []).length > 0 && `📞 ${(appart.calls || []).length}`}
                      </span>
                      <span className="appart-btn-score">{appart.score}/10</span>
                    </div>
                  </button>
                ))}
              </div>
            </div>
            <div>
              {selectedAppart ? (
                <div className="detail-card">
                  <div className="detail-header">
                    <div className="detail-title">
                      <h2>{selectedAppart.rank} {selectedAppart.name}</h2>
                      <p>{selectedAppart.location}</p>
                    </div>
                    <div style={{ display: 'flex', gap: '12px', alignItems: 'flex-start' }}>
                      <div className="score-big">{selectedAppart.score}/10</div>
                      <button className="btn-delete-appart" onClick={handleDeleteAppart}>Supprimer</button>
                    </div>
                  </div>
                  <div className="stats-grid">
                    <div className="stat-item"><div className="stat-label">Prix</div><div className="stat-value">{selectedAppart.price.toLocaleString()}€</div></div>
                    <div className="stat-item"><div className="stat-label">Surface</div><div className="stat-value">{selectedAppart.surface}m²</div></div>
                    <div className="stat-item"><div className="stat-label">Prix/m²</div><div className="stat-value">{Math.round(selectedAppart.price / selectedAppart.surface).toLocaleString()}€</div></div>
                  </div>
                  <div style={{ fontSize: '14px', color: '#cbd5e1', marginBottom: '16px' }}><strong>Notes:</strong> {selectedAppart.notes}</div>

                  <div className="section-title">📍 Visites prévues</div>
                  {(selectedAppart.visits || []).length === 0 ? (
                    <p style={{ fontSize: '12px', color: '#64748b', marginBottom: '12px' }}>Aucune visite</p>
                  ) : (
                    <div className="visits-list">
                      {(selectedAppart.visits || []).sort((a, b) => `${a.date}${a.time}`.localeCompare(`${b.date}${b.time}`)).map((v, idx) => (
                        <div key={idx} className="visit-card" onClick={() => setSelectedVisit(v)}>
                          <div className="visit-info">
                            <div className="visit-card-time">{v.time}</div>
                            <div style={{ fontSize: '12px', color: '#cbd5e1' }}>{new Date(v.date).toLocaleDateString('fr-FR')}</div>
                            {(v.questions || []).length > 0 && <div style={{ fontSize: '11px', color: '#fbbf24', marginTop: '4px' }}>{(v.questions || []).length} question(s)</div>}
                          </div>
                          <button className="btn-delete" onClick={(e) => { e.stopPropagation(); handleDeleteVisit(idx); }}>✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="add-section">
                    <h4>Ajouter une visite</h4>
                    <input type="date" value={newVisit.date} onChange={(e) => setNewVisit({ ...newVisit, date: e.target.value })} />
                    <input type="time" value={newVisit.time} onChange={(e) => setNewVisit({ ...newVisit, time: e.target.value })} />
                    <button className="btn-save" disabled={!newVisit.date || !newVisit.time} onClick={handleAddVisit}>+ Ajouter visite</button>
                  </div>

                  <div className="divider"></div>
                  <div className="section-title">📞 Appels</div>
                  {(selectedAppart.calls || []).length === 0 ? (
                    <p style={{ fontSize: '12px', color: '#64748b', marginBottom: '16px' }}>Aucun appel</p>
                  ) : (
                    <div className="calls-list">
                      {(selectedAppart.calls || []).map((call, idx) => (
                        <div key={idx} className="call-item">
                          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                            <div className="call-date">📞 {new Date(call.date).toLocaleDateString('fr-FR')}</div>
                            <button className="btn-delete" onClick={() => handleDeleteCall(idx)}>✕</button>
                          </div>
                          <div style={{ color: '#e2e8f0', marginBottom: '6px' }}>{call.note}</div>
                          {call.relanceDate && <div style={{ fontSize: '12px', color: '#64748b' }}>📅 Relancer: {new Date(call.relanceDate).toLocaleDateString('fr-FR')}</div>}
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="add-section">
                    <h4>Ajouter un appel</h4>
                    <input type="date" value={newCall.date} onChange={(e) => setNewCall({ ...newCall, date: e.target.value })} />
                    <textarea value={newCall.note} onChange={(e) => setNewCall({ ...newCall, note: e.target.value })} placeholder="Note rapide (ex: demande rappel semaine pro, pas intéressé...)" />
                    <input type="date" value={newCall.relanceDate} onChange={(e) => setNewCall({ ...newCall, relanceDate: e.target.value })} />
                    <button className="btn-save" disabled={!newCall.note || !newCall.date} onClick={handleAddCall}>+ Enregistrer appel</button>
                  </div>
                </div>
              ) : (
                <div className="empty-state"><p>Sélectionne un appart pour voir les détails</p></div>
              )}
            </div>
          </div>

          {showAddAppart && (
            <div className="modal-overlay" onClick={() => setShowAddAppart(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()}>
                <h2>Ajouter un appart</h2>
                <input 
                  type="text" 
                  placeholder="Nom (ex: Esplanade F3)" 
                  value={newAppart.name}
                  onChange={(e) => setNewAppart({ ...newAppart, name: e.target.value })}
                />
                <input 
                  type="number" 
                  placeholder="Prix (€)" 
                  value={newAppart.price}
                  onChange={(e) => setNewAppart({ ...newAppart, price: e.target.value })}
                />
                <input 
                  type="number" 
                  placeholder="Surface (m²)" 
                  step="0.1"
                  value={newAppart.surface}
                  onChange={(e) => setNewAppart({ ...newAppart, surface: e.target.value })}
                />
                <input 
                  type="text" 
                  placeholder="Localisation" 
                  value={newAppart.location}
                  onChange={(e) => setNewAppart({ ...newAppart, location: e.target.value })}
                />
                <input 
                  type="number" 
                  placeholder="Score (0-10)" 
                  step="0.5"
                  min="0"
                  max="10"
                  value={newAppart.score}
                  onChange={(e) => setNewAppart({ ...newAppart, score: e.target.value })}
                />
                <div className="modal-buttons">
                  <button className="btn-cancel" onClick={() => setShowAddAppart(false)}>Annuler</button>
                  <button className="btn-save" onClick={handleAddAppartSubmit}>Ajouter</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AppartCRM />);
  </script>
</body>
</html>
