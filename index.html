<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appart CRM</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #f1f5f9; }
    
    .app { display: flex; height: 100vh; }
    .sidebar { width: 250px; background: #0f172a; border-right: 1px solid #1e293b; overflow-y: auto; }
    .main { flex: 1; display: flex; flex-direction: column; }
    
    .logo { padding: 20px 16px; border-bottom: 1px solid #1e293b; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
    .nav-item { padding: 12px 16px; cursor: pointer; margin: 0 8px; border-radius: 4px; transition: all 0.2s; border-left: 3px solid transparent; }
    .nav-item:hover { background: #1e293b; }
    .nav-item.active { background: #1e293b; border-left-color: #d97706; color: #fbbf24; }
    .nav-section { padding: 8px 16px; font-size: 11px; color: #64748b; font-weight: 600; margin-top: 16px; }
    
    .header { background: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .content { flex: 1; overflow-y: auto; padding: 24px; }
    
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .card-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
    
    .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; font-size: 14px; }
    .btn-primary { background: #d97706; color: white; }
    .btn-primary:hover { background: #b45309; }
    .btn-secondary { background: #334155; color: white; }
    .btn-secondary:hover { background: #475569; }
    .btn-small { padding: 4px 12px; font-size: 12px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .project-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; cursor: pointer; transition: all 0.2s; }
    .project-card:hover { border-color: #d97706; transform: translateY(-2px); }
    
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #1e293b; border-radius: 8px; padding: 24px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
    
    .input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; color: #f1f5f9; margin-bottom: 12px; font-size: 14px; font-family: inherit; }
    .textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; color: #f1f5f9; margin-bottom: 12px; font-size: 14px; font-family: inherit; min-height: 80px; resize: vertical; }
    
    .appart-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; cursor: pointer; transition: all 0.2s; }
    .appart-card:hover { border-color: #d97706; }
    .appart-name { font-weight: 600; margin-bottom: 8px; }
    .appart-info { font-size: 13px; color: #94a3b8; }
    
    .question-item { background: #0f172a; border-left: 3px solid #d97706; padding: 12px; margin-bottom: 8px; border-radius: 4px; }
    .question-text { font-weight: 600; margin-bottom: 8px; }
    .answer-input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 8px; color: #f1f5f9; font-size: 12px; margin-top: 4px; }
    
    .empty-state { text-align: center; padding: 40px; color: #64748b; }
    
    @media (max-width: 768px) {
      .sidebar { width: 100%; }
      .app { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [page, setPage] = useState('home');
      const [projects, setProjects] = useState([]);
      const [selectedProject, setSelectedProject] = useState(null);
      const [profile, setProfile] = useState({ name: 'Sacha', city: 'Strasbourg', budget: '170-180k€', email: '' });
      const [showNewProject, setShowNewProject] = useState(false);
      const [newProjectName, setNewProjectName] = useState('');

      useEffect(() => {
        const saved = localStorage.getItem('appart-projects');
        const savedProfile = localStorage.getItem('appart-profile');
        
        if (saved) setProjects(JSON.parse(saved));
        if (savedProfile) setProfile(JSON.parse(savedProfile));
      }, []);

      useEffect(() => {
        localStorage.setItem('appart-projects', JSON.stringify(projects));
      }, [projects]);

      useEffect(() => {
        localStorage.setItem('appart-profile', JSON.stringify(profile));
      }, [profile]);

      const createNewProject = () => {
        if (!newProjectName.trim()) return;
        const newProject = {
          id: Date.now(),
          name: newProjectName,
          createdAt: new Date().toLocaleDateString('fr-FR'),
          apparts: []
        };
        setProjects([...projects, newProject]);
        setNewProjectName('');
        setShowNewProject(false);
      };

      const openProject = (project) => {
        setSelectedProject(project);
        setPage('project');
      };

      const updateProject = (updatedProject) => {
        setProjects(projects.map(p => p.id === updatedProject.id ? updatedProject : p));
        setSelectedProject(updatedProject);
      };

      return (
        <div className="app">
          <div className="sidebar">
            <div className="logo">🏠 Appart CRM</div>
            <nav>
              <div 
                className={`nav-item ${page === 'home' ? 'active' : ''}`} 
                onClick={() => setPage('home')}
              >
                🏠 Accueil
              </div>
              {selectedProject && (
                <div 
                  className={`nav-item ${page === 'project' ? 'active' : ''}`} 
                  onClick={() => setPage('project')}
                >
                  📋 {selectedProject.name}
                </div>
              )}
              <div 
                className={`nav-item ${page === 'calendar' ? 'active' : ''}`} 
                onClick={() => setPage('calendar')}
              >
                📅 Calendrier
              </div>
              <div 
                className={`nav-item ${page === 'profile' ? 'active' : ''}`} 
                onClick={() => setPage('profile')}
              >
                👤 Profil
              </div>
            </nav>
          </div>

          <div className="main">
            <div className="header">
              <h1>
                {page === 'home' ? 'Mes Projets' : 
                 page === 'project' ? selectedProject?.name : 
                 page === 'calendar' ? 'Calendrier' : 'Profil'}
              </h1>
            </div>

            <div className="content">
              {page === 'home' && <HomePage projects={projects} onOpenProject={openProject} onNewProject={() => setShowNewProject(true)} />}
              {page === 'project' && selectedProject && <ProjectPage project={selectedProject} onUpdateProject={updateProject} />}
              {page === 'calendar' && <CalendarPage projects={projects} />}
              {page === 'profile' && <ProfilePage profile={profile} onUpdateProfile={setProfile} />}

              {showNewProject && (
                <div className="modal-overlay" onClick={() => setShowNewProject(false)}>
                  <div className="modal" onClick={e => e.stopPropagation()}>
                    <h2 style={{ marginBottom: '16px' }}>Nouveau Projet</h2>
                    <input 
                      className="input"
                      placeholder="Nom du projet"
                      value={newProjectName}
                      onChange={e => setNewProjectName(e.target.value)}
                      autoFocus
                    />
                    <div className="modal-buttons">
                      <button className="btn btn-secondary" onClick={() => setShowNewProject(false)}>Annuler</button>
                      <button className="btn btn-primary" onClick={createNewProject}>Créer</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function HomePage({ projects, onOpenProject, onNewProject }) {
      return (
        <div>
          <div style={{ marginBottom: '24px' }}>
            <button className="btn btn-primary" onClick={onNewProject}>+ Nouveau Projet</button>
          </div>
          {projects.length === 0 ? (
            <div className="empty-state">
              <h3>Aucun projet</h3>
              <p>Crée ton premier projet pour commencer</p>
            </div>
          ) : (
            <div className="grid">
              {projects.map(p => (
                <div key={p.id} className="project-card" onClick={() => onOpenProject(p)}>
                  <div className="card-title">{p.name}</div>
                  <div style={{ color: '#94a3b8', fontSize: '13px' }}>Créé: {p.createdAt}</div>
                  <div style={{ color: '#fbbf24', fontSize: '13px', marginTop: '8px' }}>{p.apparts?.length || 0} appart(s)</div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ProjectPage({ project, onUpdateProject }) {
      const [apparts, setApparts] = useState(project.apparts || []);
      const [selectedAppart, setSelectedAppart] = useState(null);
      const [showNewAppart, setShowNewAppart] = useState(false);
      const [newForm, setNewForm] = useState({ name: '', price: '', surface: '', location: '', score: '' });

      const sortApparts = (list) => {
        return [...list].sort((a, b) => b.score - a.score).map((a, idx) => {
          const ranks = ['🥇', '🥈', '🥉'];
          return { ...a, rank: ranks[idx] || (idx + 1).toString() };
        });
      };

      const handleAddAppart = () => {
        if (!newForm.name || !newForm.price || !newForm.surface || !newForm.location || !newForm.score) return;
        const newA = {
          id: Date.now(),
          name: newForm.name,
          price: parseInt(newForm.price),
          surface: parseFloat(newForm.surface),
          location: newForm.location,
          score: parseFloat(newForm.score),
          notes: '',
          visits: [],
          calls: []
        };
        const sorted = sortApparts([...apparts, newA]);
        setApparts(sorted);
        onUpdateProject({ ...project, apparts: sorted });
        setNewForm({ name: '', price: '', surface: '', location: '', score: '' });
        setShowNewAppart(false);
      };

      const updateAppart = (id, updates) => {
        const updated = apparts.map(a => a.id === id ? { ...a, ...updates } : a);
        setApparts(updated);
        onUpdateProject({ ...project, apparts: updated });
        if (selectedAppart?.id === id) setSelectedAppart({ ...selectedAppart, ...updates });
      };

      const sorted = sortApparts(apparts);

      if (selectedAppart) {
        return <AppartDetail appart={selectedAppart} onBack={() => setSelectedAppart(null)} onUpdate={(updates) => updateAppart(selectedAppart.id, updates)} />;
      }

      return (
        <div>
          <div style={{ marginBottom: '20px', display: 'flex', gap: '8px' }}>
            <button className="btn btn-primary" onClick={() => setShowNewAppart(true)}>+ Ajouter appart</button>
            <span style={{ color: '#94a3b8' }}>{sorted.length} appart(s)</span>
          </div>

          <div className="grid">
            {sorted.map(a => (
              <div key={a.id} className="appart-card" onClick={() => setSelectedAppart(a)}>
                <div className="appart-name">{a.rank} {a.name}</div>
                <div className="appart-info">{a.location}</div>
                <div className="appart-info">{a.price.toLocaleString()}€ • {a.surface}m²</div>
                <div style={{ marginTop: '8px', display: 'flex', justifyContent: 'space-between' }}>
                  <div style={{ color: '#fbbf24', fontWeight: 'bold' }}>{a.score}/10</div>
                  {a.visits?.length > 0 && <div style={{ fontSize: '12px', color: '#fbbf24' }}>📍 {a.visits.length}</div>}
                </div>
              </div>
            ))}
          </div>

          {showNewAppart && (
            <div className="modal-overlay" onClick={() => setShowNewAppart(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h2 style={{ marginBottom: '16px' }}>Ajouter un appart</h2>
                <input className="input" placeholder="Nom" value={newForm.name} onChange={e => setNewForm({ ...newForm, name: e.target.value })} />
                <input className="input" type="number" placeholder="Prix (€)" value={newForm.price} onChange={e => setNewForm({ ...newForm, price: e.target.value })} />
                <input className="input" type="number" placeholder="Surface (m²)" step="0.1" value={newForm.surface} onChange={e => setNewForm({ ...newForm, surface: e.target.value })} />
                <input className="input" placeholder="Localisation" value={newForm.location} onChange={e => setNewForm({ ...newForm, location: e.target.value })} />
                <input className="input" type="number" placeholder="Score (0-10)" step="0.5" min="0" max="10" value={newForm.score} onChange={e => setNewForm({ ...newForm, score: e.target.value })} />
                <div className="modal-buttons">
                  <button className="btn btn-secondary" onClick={() => setShowNewAppart(false)}>Annuler</button>
                  <button className="btn btn-primary" onClick={handleAddAppart}>Ajouter</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AppartDetail({ appart, onBack, onUpdate }) {
      const [notes, setNotes] = useState(appart.notes);
      const [showAddVisit, setShowAddVisit] = useState(false);
      const [visitForm, setVisitForm] = useState({ date: '', time: '' });
      const [showAddQuestion, setShowAddQuestion] = useState(false);
      const [newQuestion, setNewQuestion] = useState('');
      const [selectedVisit, setSelectedVisit] = useState(null);

      const handleSaveNotes = () => {
        onUpdate({ notes });
      };

      const handleAddVisit = () => {
        if (!visitForm.date || !visitForm.time) return;
        const visit = { id: Date.now(), date: visitForm.date, time: visitForm.time, questions: [] };
        onUpdate({ visits: [...(appart.visits || []), visit] });
        setVisitForm({ date: '', time: '' });
        setShowAddVisit(false);
      };

      const handleAddQuestion = () => {
        if (!newQuestion.trim() || !selectedVisit) return;
        const updatedVisits = appart.visits.map(v => 
          v.id === selectedVisit.id 
            ? { ...v, questions: [...(v.questions || []), { id: Date.now(), text: newQuestion, answer: '' }] }
            : v
        );
        onUpdate({ visits: updatedVisits });
        setNewQuestion('');
        setSelectedVisit({ ...selectedVisit, questions: updatedVisits.find(v => v.id === selectedVisit.id).questions });
      };

      const updateAnswer = (visitId, questionId, answer) => {
        const updatedVisits = appart.visits.map(v => 
          v.id === visitId 
            ? { ...v, questions: v.questions.map(q => q.id === questionId ? { ...q, answer } : q) }
            : v
        );
        onUpdate({ visits: updatedVisits });
        if (selectedVisit?.id === visitId) {
          setSelectedVisit({ ...selectedVisit, questions: updatedVisits.find(v => v.id === visitId).questions });
        }
      };

      if (selectedVisit) {
        return (
          <div>
            <button className="btn btn-secondary" onClick={() => setSelectedVisit(null)} style={{ marginBottom: '16px' }}>← Retour</button>
            <div className="card">
              <div className="card-title">📍 Visite du {new Date(selectedVisit.date).toLocaleDateString('fr-FR')} à {selectedVisit.time}</div>
              
              <div style={{ marginBottom: '16px' }}>
                <div style={{ fontWeight: '600', marginBottom: '8px' }}>Questions</div>
                {(selectedVisit.questions || []).length === 0 ? (
                  <p style={{ fontSize: '13px', color: '#94a3b8' }}>Aucune question</p>
                ) : (
                  selectedVisit.questions.map(q => (
                    <div key={q.id} className="question-item">
                      <div className="question-text">Q: {q.text}</div>
                      <textarea 
                        className="answer-input"
                        placeholder="Réponse..."
                        value={q.answer}
                        onChange={e => updateAnswer(selectedVisit.id, q.id, e.target.value)}
                      />
                    </div>
                  ))
                )}
              </div>

              <div>
                <input className="input" placeholder="Nouvelle question" value={newQuestion} onChange={e => setNewQuestion(e.target.value)} />
                <button className="btn btn-primary btn-small" onClick={handleAddQuestion}>+ Ajouter question</button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div>
          <button className="btn btn-secondary" onClick={onBack} style={{ marginBottom: '16px' }}>← Retour</button>
          
          <div className="card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '16px' }}>
              <div>
                <div className="card-title">{appart.rank} {appart.name}</div>
                <div style={{ color: '#94a3b8' }}>{appart.location}</div>
              </div>
              <div style={{ fontSize: '28px', fontWeight: 'bold', color: '#fbbf24' }}>{appart.score}/10</div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '12px', background: '#0f172a', padding: '12px', borderRadius: '6px', marginBottom: '16px' }}>
              <div><div style={{ fontSize: '11px', color: '#64748b' }}>Prix</div><div style={{ fontWeight: 'bold', marginTop: '4px' }}>{appart.price.toLocaleString()}€</div></div>
              <div><div style={{ fontSize: '11px', color: '#64748b' }}>Surface</div><div style={{ fontWeight: 'bold', marginTop: '4px' }}>{appart.surface}m²</div></div>
              <div><div style={{ fontSize: '11px', color: '#64748b' }}>Prix/m²</div><div style={{ fontWeight: 'bold', marginTop: '4px' }}>{Math.round(appart.price / appart.surface).toLocaleString()}€</div></div>
            </div>

            <div style={{ marginBottom: '16px' }}>
              <div style={{ fontWeight: '600', marginBottom: '8px' }}>📝 Notes personnelles</div>
              <textarea className="textarea" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Ajoute tes notes..." />
              <button className="btn btn-primary btn-small" onClick={handleSaveNotes}>Sauvegarder</button>
            </div>

            <div>
              <div style={{ fontWeight: '600', marginBottom: '8px' }}>📍 Visites prévues</div>
              {(appart.visits || []).length === 0 ? (
                <p style={{ fontSize: '13px', color: '#94a3b8', marginBottom: '12px' }}>Aucune visite</p>
              ) : (
                appart.visits.map(v => (
                  <div key={v.id} className="appart-card" onClick={() => setSelectedVisit(v)} style={{ cursor: 'pointer' }}>
                    <div style={{ color: '#fbbf24', fontWeight: '600' }}>{v.time}</div>
                    <div style={{ fontSize: '12px', color: '#cbd5e1' }}>{new Date(v.date).toLocaleDateString('fr-FR')}</div>
                    {v.questions?.length > 0 && <div style={{ fontSize: '11px', color: '#fbbf24', marginTop: '4px' }}>{v.questions.length} question(s)</div>}
                  </div>
                ))
              )}
              <input className="input" type="date" value={visitForm.date} onChange={e => setVisitForm({ ...visitForm, date: e.target.value })} style={{ marginTop: '12px' }} />
              <input className="input" type="time" value={visitForm.time} onChange={e => setVisitForm({ ...visitForm, time: e.target.value })} />
              <button className="btn btn-primary btn-small" onClick={handleAddVisit}>+ Ajouter visite</button>
            </div>
          </div>
        </div>
      );
    }

    function CalendarPage({ projects }) {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const getAllVisits = () => {
        const visits = [];
        projects.forEach(p => {
          (p.apparts || []).forEach(a => {
            (a.visits || []).forEach(v => {
              visits.push({ ...v, apartName: a.name, projectName: p.name });
            });
          });
        });
        return visits;
      };

      const visits = getAllVisits();
      const visitDates = visits.map(v => new Date(v.date).getDate());
      const days = [];
      for (let i = 0; i < firstDay; i++) days.push(null);
      for (let i = 1; i <= daysInMonth; i++) days.push(i);

      const dayLabels = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];

      return (
        <div>
          <div className="card">
            <div className="card-title" style={{ marginBottom: '16px' }}>{new Date(year, month).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '8px' }}>
              {dayLabels.map(l => <div key={l} style={{ textAlign: 'center', fontSize: '11px', color: '#64748b', fontWeight: '600' }}>{l}</div>)}
              {days.map((d, i) => (
                <div key={i} style={{ textAlign: 'center', padding: '8px', borderRadius: '4px', background: d === null ? 'transparent' : visitDates.includes(d) ? '#d97706' : d === today.getDate() ? '#334155' : '#1e293b', color: visitDates.includes(d) ? 'white' : '#f1f5f9', fontWeight: visitDates.includes(d) ? 'bold' : 'normal' }}>
                  {d}
                </div>
              ))}
            </div>
          </div>

          {visits.length > 0 && (
            <div className="card">
              <div className="card-title">Visites prévues</div>
              {visits.sort((a, b) => a.date.localeCompare(b.date)).map((v, i) => (
                <div key={i} style={{ padding: '12px', background: '#0f172a', borderRadius: '4px', marginBottom: '8px', fontSize: '13px' }}>
                  <span style={{ color: '#fbbf24', fontWeight: '600' }}>{v.time}</span> - {v.apartName} ({v.projectName})
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ProfilePage({ profile, onUpdateProfile }) {
      const [editing, setEditing] = useState(false);
      const [form, setForm] = useState(profile);

      const handleSave = () => {
        onUpdateProfile(form);
        setEditing(false);
      };

      return (
        <div className="card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
            <div className="card-title">Mon Profil</div>
            <button className="btn btn-secondary btn-small" onClick={() => setEditing(!editing)}>
              {editing ? 'Annuler' : 'Modifier'}
            </button>
          </div>

          {editing ? (
            <div>
              <input className="input" placeholder="Nom" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
              <input className="input" placeholder="Ville" value={form.city} onChange={e => setForm({ ...form, city: e.target.value })} />
              <input className="input" placeholder="Budget" value={form.budget} onChange={e => setForm({ ...form, budget: e.target.value })} />
              <input className="input" placeholder="Email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} />
              <button className="btn btn-primary" onClick={handleSave}>Sauvegarder</button>
            </div>
          ) : (
            <div>
              <div style={{ marginBottom: '16px' }}>
                <div style={{ fontSize: '12px', color: '#64748b' }}>Nom</div>
                <div style={{ fontWeight: '600', marginTop: '4px' }}>{profile.name}</div>
              </div>
              <div style={{ marginBottom: '16px' }}>
                <div style={{ fontSize: '12px', color: '#64748b' }}>Ville</div>
                <div style={{ fontWeight: '600', marginTop: '4px' }}>{profile.city}</div>
              </div>
              <div style={{ marginBottom: '16px' }}>
                <div style={{ fontSize: '12px', color: '#64748b' }}>Budget</div>
                <div style={{ fontWeight: '600', marginTop: '4px' }}>{profile.budget}</div>
              </div>
              <div>
                <div style={{ fontSize: '12px', color: '#64748b' }}>Email</div>
                <div style={{ fontWeight: '600', marginTop: '4px' }}>{profile.email || 'Non défini'}</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
