<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appart CRM</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #f1f5f9; }
    
    .app-container { display: flex; height: 100vh; }
    .sidebar { width: 250px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; position: fixed; height: 100vh; left: 0; top: 0; overflow-y: auto; z-index: 100; }
    .main { flex: 1; margin-left: 250px; display: flex; flex-direction: column; height: 100vh; }
    
    .logo { padding: 20px 16px; border-bottom: 1px solid #1e293b; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
    .nav-item { padding: 12px 16px; cursor: pointer; border-left: 3px solid transparent; margin: 0 8px; border-radius: 4px; transition: all 0.2s; }
    .nav-item:hover { background: #1e293b; }
    .nav-item.active { background: #1e293b; border-left-color: #d97706; color: #fbbf24; }
    .nav-section { padding: 8px 16px; font-size: 11px; color: #64748b; font-weight: 600; margin-top: 20px; }
    
    .header { background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid #1e293b; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 24px; font-weight: bold; }
    
    .content { flex: 1; overflow-y: auto; padding: 24px; }
    
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-title { font-size: 18px; font-weight: bold; }
    
    .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; }
    .btn-primary { background: #d97706; color: white; }
    .btn-primary:hover { background: #b45309; }
    .btn-secondary { background: #334155; color: white; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover { background: #991b1b; }
    
    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .project-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; cursor: pointer; transition: all 0.2s; }
    .project-card:hover { background: #334155; border-color: #d97706; }
    .project-name { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
    .project-meta { font-size: 12px; color: #94a3b8; }
    
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #1e293b; border-radius: 8px; padding: 24px; max-width: 500px; width: 90%; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
    
    .input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; color: #f1f5f9; margin-bottom: 12px; font-family: inherit; font-size: 14px; }
    
    .profile-section { margin-bottom: 24px; }
    .profile-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .profile-value { font-size: 16px; font-weight: 600; }
    
    .empty-state { text-align: center; padding: 40px 20px; color: #64748b; }
    .empty-state h3 { font-size: 18px; margin-bottom: 8px; }
    
    @media (max-width: 768px) {
      .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid #1e293b; }
      .main { margin-left: 0; }
      .app-container { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function AppartCRM() {
      const [page, setPage] = useState('home');
      const [projects, setProjects] = useState([]);
      const [selectedProject, setSelectedProject] = useState(null);
      const [profile, setProfile] = useState({ name: 'Sacha', city: 'Strasbourg', budget: '170-180k€', email: '' });
      const [showNewProject, setShowNewProject] = useState(false);
      const [newProjectName, setNewProjectName] = useState('');

      useEffect(() => {
        const saved = localStorage.getItem('appart-projects');
        if (saved) {
          setProjects(JSON.parse(saved));
        } else {
          const defaultProject = {
            id: 1,
            name: 'Recherche Appart Strasbourg',
            createdAt: new Date().toLocaleDateString('fr-FR'),
            apartCount: 18,
            apparts: initApparts()
          };
          setProjects([defaultProject]);
        }
        
        const savedProfile = localStorage.getItem('appart-profile');
        if (savedProfile) setProfile(JSON.parse(savedProfile));
      }, []);

      useEffect(() => {
        localStorage.setItem('appart-projects', JSON.stringify(projects));
      }, [projects]);

      useEffect(() => {
        localStorage.setItem('appart-profile', JSON.stringify(profile));
      }, [profile]);

      const initApparts = () => [
        { id: 1, name: 'Esplanade F3 balcon', price: 162750, surface: 61, location: 'Esplanade', score: 9, notes: 'Meilleur combo', calls: [], visits: [] },
        { id: 2, name: 'Neudorf 3P 62m²', price: 153000, surface: 62, location: 'Neudorf', score: 8.5, notes: 'Prix/m² imbattable', calls: [], visits: [] },
        { id: 3, name: 'Kléber-Gare 2P 59m²', price: 210000, surface: 59, location: 'Kléber-Gare', score: 7, notes: 'Emplacement top', calls: [], visits: [] },
        { id: 4, name: 'Neudorf F4 Place du Marché', price: 219000, surface: 82, location: 'Neudorf', score: 7, notes: 'Surface imbattable', calls: [], visits: [] },
        { id: 5, name: 'Petite France F2', price: 199990, surface: 39.7, location: 'Petite France', score: 6.5, notes: 'Meilleur Airbnb', calls: [], visits: [] },
        { id: 6, name: 'La Meinau 3P 85m²', price: 199000, surface: 85, location: 'La Meinau', score: 6.5, notes: 'Surface exceptionnelle', calls: [], visits: [] },
        { id: 7, name: 'Neudorf T2 42m²', price: 136500, surface: 42, location: 'Neudorf', score: 6, notes: 'DPE C/GES A', calls: [], visits: [] },
        { id: 8, name: 'Neudorf T2 rénové', price: 159950, surface: 41, location: 'Neudorf', score: 5.5, notes: 'Zéro levier travaux', calls: [], visits: [] },
        { id: 9, name: 'Neudorf F3 62m²', price: 199400, surface: 62, location: 'Neudorf', score: 5.5, notes: 'Partiellement rénové', calls: [], visits: [] },
        { id: 10, name: 'Vauban Est 3P', price: 215000, surface: 57, location: 'Vauban Est', score: 5, notes: 'Risque juridique', calls: [], visits: [] },
        { id: 11, name: 'Esplanade T2', price: 155875, surface: 41, location: 'Esplanade', score: 5, notes: 'DPE E', calls: [], visits: [] },
        { id: 12, name: 'Esplanade Krutenau', price: 193158, surface: 51, location: 'Esplanade', score: 4.5, notes: 'Sans ascenseur', calls: [], visits: [] },
        { id: 13, name: 'Robertsau T2', price: 173000, surface: 45.8, location: 'Robertsau', score: 4.5, notes: 'Quartier excentré', calls: [], visits: [] },
        { id: 14, name: 'Studio Krutenau', price: 140000, surface: 28, location: 'Krutenau', score: 3, notes: 'Trop petit', calls: [], visits: [] },
        { id: 15, name: 'Neudorf F3 Orpi', price: 235000, surface: 74, location: 'Neudorf', score: 3, notes: 'Trop cher', calls: [], visits: [] },
        { id: 16, name: 'Vauban Est Foncia 2P', price: 205000, surface: 50, location: 'Vauban Est', score: 3, notes: 'Hors budget', calls: [], visits: [] },
        { id: 17, name: 'Neudorf F3 terrasse', price: 240000, surface: 60, location: 'Neudorf', score: 2, notes: 'Hors budget total', calls: [], visits: [] },
        { id: 18, name: 'Quartier Marne Orangerie', price: 218000, surface: 53, location: 'Quartier Marne', score: 2, notes: 'Peu de levier', calls: [], visits: [] },
      ];

      const handleNewProject = () => {
        if (!newProjectName.trim()) return;
        const newProject = {
          id: Math.max(...projects.map(p => p.id), 0) + 1,
          name: newProjectName,
          createdAt: new Date().toLocaleDateString('fr-FR'),
          apartCount: 0,
          apparts: []
        };
        setProjects([...projects, newProject]);
        setNewProjectName('');
        setShowNewProject(false);
      };

      const openProject = (project) => {
        setSelectedProject(project);
        setPage('project');
      };

      const getRank = (index) => {
        const ranks = ['🥇', '🥈', '🥉'];
        return ranks[index] || (index + 1).toString();
      };

      const sortApparts = (apparts) => {
        return [...apparts].sort((a, b) => b.score - a.score).map((a, idx) => ({ ...a, rank: getRank(idx) }));
      };

      return (
        <div className="app-container">
          <div className="sidebar">
            <div className="logo">🏠 Appart CRM</div>
            <nav>
              <div className="nav-item" onClick={() => setPage('home')} style={{ cursor: 'pointer', borderLeftColor: page === 'home' ? '#d97706' : 'transparent', color: page === 'home' ? '#fbbf24' : '#f1f5f9' }}>
                🏠 Accueil
              </div>
              {selectedProject && (
                <div className="nav-item" onClick={() => setPage('project')} style={{ cursor: 'pointer', borderLeftColor: page === 'project' ? '#d97706' : 'transparent', color: page === 'project' ? '#fbbf24' : '#f1f5f9' }}>
                  📋 {selectedProject.name}
                </div>
              )}
              <div className="nav-item" onClick={() => setPage('calendar')} style={{ cursor: 'pointer', borderLeftColor: page === 'calendar' ? '#d97706' : 'transparent', color: page === 'calendar' ? '#fbbf24' : '#f1f5f9' }}>
                📅 Calendrier
              </div>
              <div className="nav-item" onClick={() => setPage('profile')} style={{ cursor: 'pointer', borderLeftColor: page === 'profile' ? '#d97706' : 'transparent', color: page === 'profile' ? '#fbbf24' : '#f1f5f9' }}>
                👤 Profil
              </div>
            </nav>
          </div>

          <div className="main">
            <div className="header">
              <h1>{page === 'home' ? 'Mes Projets' : page === 'project' ? selectedProject?.name : page === 'calendar' ? 'Calendrier' : 'Profil'}</h1>
            </div>

            <div className="content">
              {page === 'home' && (
                <div>
                  <div style={{ marginBottom: '24px' }}>
                    <button className="btn btn-primary" onClick={() => setShowNewProject(true)}>+ Nouveau Projet</button>
                  </div>
                  {projects.length === 0 ? (
                    <div className="empty-state">
                      <h3>Aucun projet</h3>
                      <p>Crée ton premier projet de recherche d'appart</p>
                    </div>
                  ) : (
                    <div className="project-grid">
                      {projects.map(project => (
                        <div key={project.id} className="project-card" onClick={() => openProject(project)}>
                          <div className="project-name">{project.name}</div>
                          <div className="project-meta">Créé: {project.createdAt}</div>
                          <div className="project-meta" style={{ marginTop: '8px' }}>{project.apartCount} appart(s)</div>
                        </div>
                      ))}
                    </div>
                  )}
                  {showNewProject && (
                    <div className="modal-overlay" onClick={() => setShowNewProject(false)}>
                      <div className="modal" onClick={e => e.stopPropagation()}>
                        <h2 style={{ marginBottom: '16px' }}>Nouveau Projet</h2>
                        <input 
                          type="text"
                          className="input"
                          placeholder="Nom du projet (ex: Recherche Appart Lyon)"
                          value={newProjectName}
                          onChange={e => setNewProjectName(e.target.value)}
                          autoFocus
                        />
                        <div className="modal-buttons">
                          <button className="btn btn-secondary" onClick={() => setShowNewProject(false)}>Annuler</button>
                          <button className="btn btn-primary" onClick={handleNewProject}>Créer</button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {page === 'project' && selectedProject && (
                <ProjectView project={selectedProject} />
              )}

              {page === 'calendar' && (
                <CalendarView projects={projects} />
              )}

              {page === 'profile' && (
                <ProfileView profile={profile} setProfile={setProfile} />
              )}
            </div>
          </div>
        </div>
      );
    }

  function ProjectView({ project }) {
  const sortAndRankApparts = (list) => {
    const ranks = ['🥇', '🥈', '🥉'];
    const getRank = (index) => ranks[index] || (index + 1).toString();
    return [...list].sort((a, b) => b.score - a.score).map((a, idx) => ({ ...a, rank: getRank(idx) }));
  };
  
  const [apparts, setApparts] = useState(sortAndRankApparts(project.apparts || []));
  const [selectedAppart, setSelectedAppart] = useState(null);
  const [showNewAppart, setShowNewAppart] = useState(false);
  const [newAppartForm, setNewAppartForm] = useState({ name: '', price: '', surface: '', location: '', score: '' });

  const handleAddAppart = () => {
    if (!newAppartForm.name || !newAppartForm.price || !newAppartForm.surface || !newAppartForm.location || !newAppartForm.score) return;
    const newA = {
      id: Math.max(...apparts.map(a => a.id), 0) + 1,
      name: newAppartForm.name,
      price: parseInt(newAppartForm.price),
      surface: parseFloat(newAppartForm.surface),
      location: newAppartForm.location,
      score: parseFloat(newAppartForm.score),
      notes: '',
      calls: [],
      visits: []
    };
    const sorted = sortAndRankApparts([...apparts, newA]);
    setApparts(sorted);
    setNewAppartForm({ name: '', price: '', surface: '', location: '', score: '' });
    setShowNewAppart(false);
  };

  const updateAppartNotes = (id, notes) => {
    const updated = apparts.map(a => a.id === id ? { ...a, notes } : a);
    setApparts(updated);
    setSelectedAppart({ ...selectedAppart, notes });
  };

  if (selectedAppart) {
    return (
      <div>
        <button className="btn btn-secondary" onClick={() => setSelectedAppart(null)} style={{ marginBottom: '16px' }}>← Retour</button>
        
        <div className="card">
          <div className="card-header">
            <div>
              <div className="card-title">{selectedAppart.rank} {selectedAppart.name}</div>
              <div style={{ color: '#94a3b8', fontSize: '14px', marginTop: '4px' }}>{selectedAppart.location}</div>
            </div>
            <div style={{ fontSize: '24px', fontWeight: 'bold', color: '#fbbf24' }}>{selectedAppart.score}/10</div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '16px', background: '#0f172a', padding: '16px', borderRadius: '6px', marginBottom: '16px' }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '12px', color: '#64748b' }}>Prix</div>
              <div style={{ fontWeight: 'bold', marginTop: '4px' }}>{selectedAppart.price.toLocaleString()}€</div>
            </div>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '12px', color: '#64748b' }}>Surface</div>
              <div style={{ fontWeight: 'bold', marginTop: '4px' }}>{selectedAppart.surface}m²</div>
            </div>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '12px', color: '#64748b' }}>Prix/m²</div>
              <div style={{ fontWeight: 'bold', marginTop: '4px' }}>{Math.round(selectedAppart.price / selectedAppart.surface).toLocaleString()}€</div>
            </div>
          </div>

          <div style={{ marginBottom: '16px' }}>
            <div style={{ fontWeight: '600', marginBottom: '8px' }}>📝 Notes personnelles</div>
            <textarea 
              className="input"
              value={selectedAppart.notes}
              onChange={(e) => updateAppartNotes(selectedAppart.id, e.target.value)}
              placeholder="Ajoute tes notes sur cet appart..."
              rows="4"
            />
          </div>

          {(selectedAppart.visits || []).length > 0 && (
            <div style={{ marginBottom: '16px' }}>
              <div style={{ fontWeight: '600', marginBottom: '8px' }}>📍 Visites prévues</div>
              {(selectedAppart.visits || []).map((v, idx) => (
                <div key={idx} style={{ background: '#0f172a', padding: '12px', borderRadius: '4px', marginBottom: '8px' }}>
                  <div style={{ color: '#fbbf24', fontWeight: '600' }}>{v.time}</div>
                  <div style={{ fontSize: '12px', color: '#cbd5e1' }}>{new Date(v.date).toLocaleDateString('fr-FR')}</div>
                  {(v.questions || []).length > 0 && <div style={{ fontSize: '11px', color: '#fbbf24', marginTop: '4px' }}>{(v.questions || []).length} question(s) en préparation</div>}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ marginBottom: '20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <p style={{ color: '#94a3b8' }}>{apparts.length} appart(s)</p>
        <button className="btn btn-primary" onClick={() => setShowNewAppart(true)}>+ Ajouter appart</button>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '16px' }}>
        {apparts.map(appart => (
          <div key={appart.id} className="card" onClick={() => setSelectedAppart(appart)} style={{ cursor: 'pointer' }}>
            <div className="card-header">
              <div>
                <div className="card-title">{appart.rank} {appart.name}</div>
                <div style={{ color: '#94a3b8', fontSize: '14px', marginTop: '4px' }}>{appart.location}</div>
              </div>
              <div style={{ fontSize: '20px', fontWeight: 'bold', color: '#fbbf24' }}>{appart.score}/10</div>
            </div>
            <div style={{ color: '#cbd5e1', fontSize: '14px' }}>{appart.price.toLocaleString()}€ • {appart.surface}m²</div>
            {(appart.visits || []).length > 0 && <div style={{ fontSize: '12px', color: '#fbbf24', marginTop: '8px' }}>📍 {(appart.visits || []).length} visite(s)</div>}
          </div>
        ))}
      </div>

      {showNewAppart && (
        <div className="modal-overlay" onClick={() => setShowNewAppart(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2 style={{ marginBottom: '16px' }}>Ajouter un appart</h2>
            <input 
              type="text"
              className="input"
              placeholder="Nom"
              value={newAppartForm.name}
              onChange={e => setNewAppartForm({ ...newAppartForm, name: e.target.value })}
            />
            <input 
              type="number"
              className="input"
              placeholder="Prix (€)"
              value={newAppartForm.price}
              onChange={e => setNewAppartForm({ ...newAppartForm, price: e.target.value })}
            />
            <input 
              type="number"
              className="input"
              placeholder="Surface (m²)"
              step="0.1"
              value={newAppartForm.surface}
              onChange={e => setNewAppartForm({ ...newAppartForm, surface: e.target.value })}
            />
            <input 
              type="text"
              className="input"
              placeholder="Localisation"
              value={newAppartForm.location}
              onChange={e => setNewAppartForm({ ...newAppartForm, location: e.target.value })}
            />
            <input 
              type="number"
              className="input"
              placeholder="Score (0-10)"
              step="0.5"
              min="0"
              max="10"
              value={newAppartForm.score}
              onChange={e => setNewAppartForm({ ...newAppartForm, score: e.target.value })}
            />
            <div className="modal-buttons">
              <button className="btn btn-secondary" onClick={() => setShowNewAppart(false)}>Annuler</button>
              <button className="btn btn-primary" onClick={handleAddAppart}>Ajouter</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

return (
  <div>
    <p style={{ marginBottom: '20px', color: '#94a3b8' }}>{apparts.length} appart(s)
      {apparts.length === 0 && <button className="btn btn-primary" onClick={loadDefaultApparts} style={{marginLeft: '12px'}}>Charger les apparts</button>}
    </p>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
            {apparts.map(appart => (
              <div key={appart.id} className="card" onClick={() => setSelectedAppart(appart)} style={{ cursor: 'pointer', borderColor: selectedAppart?.id === appart.id ? '#d97706' : '#334155' }}>
                <div className="card-header">
                  <div>
                    <div className="card-title">{appart.rank} {appart.name}</div>
                    <div style={{ color: '#94a3b8', fontSize: '14px', marginTop: '4px' }}>{appart.location}</div>
                  </div>
                  <div style={{ fontSize: '20px', fontWeight: 'bold', color: '#fbbf24' }}>{appart.score}/10</div>
                </div>
                <div style={{ color: '#cbd5e1', fontSize: '14px' }}>{appart.price.toLocaleString()}€ • {appart.surface}m²</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CalendarView({ projects }) {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const getAllVisits = () => {
        const visits = [];
        projects.forEach(p => {
          (p.apparts || []).forEach(a => {
            (a.visits || []).forEach(v => {
              visits.push({ ...v, apartName: a.name, projectName: p.name, date: v.date });
            });
          });
        });
        return visits;
      };

      const visits = getAllVisits();
      const visitDates = visits.map(v => new Date(v.date).getDate());
      const days = [];
      
      for (let i = 0; i < firstDay; i++) days.push(null);
      for (let i = 1; i <= daysInMonth; i++) days.push(i);
      
      const dayLabels = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
      
      return (
        <div>
          <div className="card">
            <div className="card-title" style={{ marginBottom: '16px' }}>{new Date(year, month).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '8px', marginBottom: '20px' }}>
              {dayLabels.map(label => <div key={label} style={{ textAlign: 'center', fontSize: '11px', color: '#64748b', fontWeight: '600' }}>{label}</div>)}
              {days.map((day, idx) => (
                <div key={idx} style={{ textAlign: 'center', padding: '8px', borderRadius: '4px', background: day === null ? 'transparent' : visitDates.includes(day) ? '#d97706' : day === today.getDate() ? '#334155' : '#1e293b', color: visitDates.includes(day) ? 'white' : '#f1f5f9', fontWeight: visitDates.includes(day) ? 'bold' : 'normal' }}>
                  {day}
                </div>
              ))}
            </div>
          </div>
          
          {visits.length > 0 && (
            <div className="card">
              <div className="card-title" style={{ marginBottom: '16px' }}>Visites prévues</div>
              {visits.sort((a, b) => a.date.localeCompare(b.date)).map((v, idx) => (
                <div key={idx} style={{ padding: '12px', background: '#0f172a', borderRadius: '4px', marginBottom: '8px', fontSize: '14px' }}>
                  <span style={{ color: '#fbbf24', fontWeight: '600' }}>{v.time}</span> - {v.apartName} ({v.projectName})
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ProfileView({ profile, setProfile }) {
      const [editing, setEditing] = useState(false);
      const [formData, setFormData] = useState(profile);

      const handleSave = () => {
        setProfile(formData);
        setEditing(false);
      };

      return (
        <div className="card">
          <div className="card-header">
            <div className="card-title">Mon Profil</div>
            <button className="btn btn-secondary" onClick={() => setEditing(!editing)}>
              {editing ? 'Annuler' : 'Modifier'}
            </button>
          </div>

          {editing ? (
            <div>
              <div style={{ marginBottom: '12px' }}>
                <div className="profile-label">Nom</div>
                <input 
                  type="text"
                  className="input"
                  value={formData.name}
                  onChange={e => setFormData({ ...formData, name: e.target.value })}
                />
              </div>
              <div style={{ marginBottom: '12px' }}>
                <div className="profile-label">Ville</div>
                <input 
                  type="text"
                  className="input"
                  value={formData.city}
                  onChange={e => setFormData({ ...formData, city: e.target.value })}
                />
              </div>
              <div style={{ marginBottom: '12px' }}>
                <div className="profile-label">Budget</div>
                <input 
                  type="text"
                  className="input"
                  value={formData.budget}
                  onChange={e => setFormData({ ...formData, budget: e.target.value })}
                />
              </div>
              <div style={{ marginBottom: '12px' }}>
                <div className="profile-label">Email</div>
                <input 
                  type="email"
                  className="input"
                  value={formData.email}
                  onChange={e => setFormData({ ...formData, email: e.target.value })}
                />
              </div>
              <button className="btn btn-primary" onClick={handleSave}>Sauvegarder</button>
            </div>
          ) : (
            <div>
              <div className="profile-section">
                <div className="profile-label">Nom</div>
                <div className="profile-value">{profile.name}</div>
              </div>
              <div className="profile-section">
                <div className="profile-label">Ville</div>
                <div className="profile-value">{profile.city}</div>
              </div>
              <div className="profile-section">
                <div className="profile-label">Budget</div>
                <div className="profile-value">{profile.budget}</div>
              </div>
              <div className="profile-section">
                <div className="profile-label">Email</div>
                <div className="profile-value">{profile.email || 'Non défini'}</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AppartCRM />);
  </script>
</body>
</html>
